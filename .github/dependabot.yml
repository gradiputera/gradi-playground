version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "vue"
          - "vue-router"
          - "@nuxt/*"
    ignore:
      # TypeScript 7 is the native (Go) compiler; vue-tsc needs the JavaScript
      # language-service API, so `nuxt typecheck` stays on TypeScript 6 for now.
      # Remove this rule once vue-tsc supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
