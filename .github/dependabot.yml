version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "vue"
          - "vue-router"
          - "@nuxt/*"
    ignore:
      # TypeScript 7 is the native (Go) compiler; vue-tsc needs the JavaScript
      # language-service API, so `nuxt typecheck` stays on TypeScript 6 for now.
      # Remove this rule once vue-tsc supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /services/payment-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/payment-service
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /services/ledger-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/ledger-service
    schedule:
      interval: weekly
    ignore:
      # The build image pins Maven and the JDK together (maven:<version>-eclipse-temurin-25).
      # Dependabot proposes non-LTS JDK tags (for example temurin-26), which the build rejects
      # (JDK [25,26) in pom.xml). Bump it by hand, together with the JDK, in its own change.
      - dependency-name: "maven"
