name: notification-service

on:
  push:
    branches: [main]
    paths:
      - "services/notification-service/**"
      - "contracts/openapi/notification.yaml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/notification-service.yml"
  pull_request:
    paths:
      - "services/notification-service/**"
      - "contracts/openapi/notification.yaml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/notification-service.yml"

permissions:
  contents: read

jobs:
  notification-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/notification-service
    env:
      # Dummy values so env() references in supabase/config.toml resolve. Not real credentials.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-secret
      SUPABASE_AUTH_CAPTCHA_SECRET: ci-dummy-captcha
      # Local-only role password from supabase/seed.sql. Not a real credential.
      LOCAL_DATABASE_URL: postgres://notification_service:local-dev-only-notification@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - name: Validate service specs
        run: npx -y @fission-ai/openspec@latest validate --all --strict

      - name: Check the API contract for breaking changes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git show "origin/${{ github.base_ref }}:contracts/openapi/notification.yaml" > "$RUNNER_TEMP/notification-base.yaml"
          cp contracts/openapi/notification.yaml "$RUNNER_TEMP/notification-revision.yaml"
          docker run --rm -v "$RUNNER_TEMP:/specs:ro" tufin/oasdiff:v1.39.0 \
            breaking --fail-on ERR /specs/notification-base.yaml /specs/notification-revision.yaml

      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Generate an ephemeral JWT signing key
        working-directory: .
        run: |
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --append

      # Database, auth and gateway only.
      - name: Start the local Supabase stack
        working-directory: .
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      # Unit and HTTP tests, plus the integration tests against the local stack. The summary must
      # count all 17 tests as passed, so the integration tests cannot pass by being skipped.
      - name: Tests
        run: |
          eval "$(supabase status -o env)"
          NOTIFICATION_TEST_DATABASE_URL="$LOCAL_DATABASE_URL" \
          NOTIFICATION_TEST_SUPABASE_URL="$API_URL" \
          NOTIFICATION_TEST_SUPABASE_KEY="$PUBLISHABLE_KEY" \
            npm test 2>&1 | tee "$RUNNER_TEMP/notification-tests.txt"
          grep -q "^ℹ tests 17$" "$RUNNER_TEMP/notification-tests.txt"
          grep -q "^ℹ pass 17$" "$RUNNER_TEMP/notification-tests.txt"
          grep -q "^ℹ skipped 0$" "$RUNNER_TEMP/notification-tests.txt"

      - name: Build the container image
        run: docker build -t notification-service:ci .

      - name: Smoke test the container
        run: |
          eval "$(supabase status -o env)"
          # The local dispatcher secret from supabase/seed.sql (not a real credential).
          webhook_secret="whsec_$(printf '%s' 'local-dev-only-notification' | base64)"
          docker run -d --name notification-service --network host \
            -e PORT=8084 -e DATABASE_URL="$LOCAL_DATABASE_URL" -e SUPABASE_URL="$API_URL" \
            -e WEBHOOK_SECRET="$webhook_secret" \
            notification-service:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8084/health && break
            sleep 1
          done
          test "$(curl -s http://127.0.0.1:8084/health)" = '{"status":"ok"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8084/sandbox/reset)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:8084/events)" = 401
          docker logs notification-service

      - name: Stop the local Supabase stack
        if: always()
        working-directory: .
        run: supabase stop --no-backup
