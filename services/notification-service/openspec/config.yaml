schema: spec-driven

context: |
  notification-service: Node.js 24 with TypeScript and Hono. It owns the notification schema (Drizzle Kit), consumes events through signed webhooks and sends email through Gmail SMTP.
  Boundaries: access only the notification schema; integrate with other services only through HTTP APIs and events (contracts in contracts/).
  Decisions: ADR 0005 (events), ADR 0007 (auth), ADR 0009 (telemetry), ADR 0011 (sandbox reset), ADR 0014 (real email).

  Guardrails:
  - Access only your own schema; no cross-schema references or joins; integrate via API or events.
  - Money is integer minor units with ISO 4217 currency, never floating point.
  - Never weaken JWT validation (signature via JWKS, iss, aud, exp; reject alg none).
  - POST /sandbox/reset deletes only the caller's rows.
  - Outbox rows are written in the same transaction as the business change; consumers are idempotent via inbox.
  - Keep /health, the site fault-flag 503 behaviour, and deployment.site telemetry.
  - Triggered only by signed event webhooks (timing-safe HMAC compare, timestamp tolerance against replay).
  - Email only through the templated, rate-limited mail module; no free-text bodies; never bypass caps.
  - Never log full email addresses or SMTP credentials; no SMS.

rules:
  proposal:
    - State the owning scope (services/notification-service) and list what is out of scope.
    - Any new email template or cap change references ADR 0014.
  specs:
    - Every requirement uses SHALL or MUST and has at least one scenario.
    - Every email requirement states its template, cap and masking behaviour.
  design:
    - Justify every new dependency here, with its pinned version and license (MIT-compatible).
    - Describe how the webhook signature and timestamp are verified.
  tasks:
    - Implement only the tasks listed here; anything else becomes a new proposal.
    - Never add a path that sends email outside the mail module.
