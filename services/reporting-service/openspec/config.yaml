schema: spec-driven

context: |
  reporting-service: Python 3.13 with FastAPI, managed with uv. It owns the reporting schema (Alembic) and provides a read model of cross-service summaries built only from events.
  Boundaries: access only the reporting schema; integrate with other services only through HTTP APIs and events (contracts in contracts/).
  Decisions: ADR 0004 (schema isolation), ADR 0005 (events), ADR 0007 (auth), ADR 0009 (telemetry), ADR 0010 (observability charts).

  Guardrails:
  - Access only your own schema; no cross-schema references or joins; integrate via API or events.
  - Money is integer minor units with ISO 4217 currency, never floating point.
  - Never weaken JWT validation (signature via JWKS, iss, aud, exp; reject alg none).
  - POST /sandbox/reset deletes only the caller's rows.
  - Outbox rows are written in the same transaction as the business change; consumers are idempotent via inbox.
  - Keep /health, the site fault-flag 503 behaviour, and deployment.site telemetry.
  - Read model built only from events; never writes to other services; parameterized SQL only.

rules:
  proposal:
    - State the owning scope (services/reporting-service) and list what is out of scope.
    - Name the events each new summary consumes.
  specs:
    - Every requirement uses SHALL or MUST and has at least one scenario.
    - Every summary requirement names its source events.
  design:
    - Justify every new dependency here, with its pinned version and license (MIT-compatible).
    - Show the parameterized query shape for each new endpoint.
  tasks:
    - Implement only the tasks listed here; anything else becomes a new proposal.
    - Never add a write outside the reporting schema.
